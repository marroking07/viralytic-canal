name: Robot de videos

on:
  schedule:
    - cron: '23 */3 * * *'   # cada 3 horas revisa si faltan videos del día
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      work: ${{ steps.peek.outputs.work }}
      app: ${{ steps.peek.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: robot.json
          sparse-checkout-cone-mode: false
      - id: peek
        run: |
          if [ ! -f robot.json ]; then echo "Falta robot.json: conecta el robot desde tu app (pestaña Robot)."; echo "work=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          cat > peek.mjs <<'PEEK_EOF'
          import fs from 'node:fs';
          const app = String(JSON.parse(fs.readFileSync('robot.json', 'utf8')).app || '').replace(/\/$/, '');
          const t = await fetch(process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=viralytic-canal', {headers: {Authorization: 'bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}}).then((r) => r.json());
          const r = await fetch(app + '/api/robot/revisar', {method: 'POST', headers: {Authorization: 'Bearer ' + t.value, 'Content-Type': 'application/json'}, body: '{}'});
          const j = await r.json().catch(() => ({}));
          console.log('Respuesta de tu app:', r.status, JSON.stringify(j));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'work=' + (!!j.work) + '\napp=' + app + '\n');
          PEEK_EOF
          node peek.mjs
  videos:
    needs: revisar
    if: needs.revisar.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas gratis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          sudo apt-get install -y -qq fonts-montserrat > /dev/null || true
          pip install -q edge-tts pillow numpy opencv-python-headless
      - name: Hacer videos
        env:
          APP_URL: ${{ needs.revisar.outputs.app }}
          BUDGET_MIN: '40'
        run: |
          cat > get.mjs <<'GET_EOF'
          import fs from 'node:fs';
          const t = await fetch(process.env.ACTIONS_ID_TOKEN_REQUEST_URL + '&audience=viralytic-canal', {headers: {Authorization: 'bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}}).then((r) => r.json());
          const r = await fetch(process.env.APP_URL + '/api/robot/codigo', {method: 'POST', headers: {Authorization: 'Bearer ' + t.value, 'Content-Type': 'application/json'}, body: '{}'});
          if (!r.ok) { console.log('Tu app no entregó el robot:', r.status, await r.text()); process.exit(1); }
          fs.writeFileSync('robot.mjs', await r.text());
          GET_EOF
          node get.mjs
          node robot.mjs
